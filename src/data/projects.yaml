# The elements inside each set.
#
# Fields
#   id           unique
#   title
#   summary      one line shown on the card
#   set          id from sets.yaml (the universal set = "Only in U" column)
#   started      'YYYY' or 'YYYY-MM'; places it on the timeline.
#                Planned projects may leave it out: they show in the current year.
#   status       live | beta | building | planned | paused | archived
#   statusNote   optional, replaces the status label (e.g. TestFlight)
#   kind         short label: Web, iOS, Open source, Research …
#   stack        optional list
#   links        optional: site, store, repo — the card opens the first one present


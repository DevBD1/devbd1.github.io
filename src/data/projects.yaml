# The elements inside each set.
#
# Fields
#   id           unique
#   title
#   summary      one line shown on the card
#   set          id from sets.yaml (the universal set = "Only in U" column)
#   started      'YYYY' or 'YYYY-MM'; places it on the timeline.
#                May mark the initial idea; later milestones are noted in comments.
#                Planned projects may leave it out: they show in the current year.
#   status       live | beta | building | planned | paused | archived
#   statusNote   optional, replaces the status label (e.g. TestFlight)
#   kind         short label: Web, iOS, Open source, Research …
#   stack        optional list
#   links        optional: site, store, repo — the card opens the first one present

- id: graphsna
  title: GraphSNA
  summary: >-
    A C# Windows desktop course project for visualizing and analyzing directed,
    weighted social network graphs. Explored data structures, BFS and DFS
    traversal, Dijkstra's and A* pathfinding, and Welsh–Powell graph coloring.
  set: devbd1
  started: "2025-11"
  status: archived
  kind: Desktop
  stack: [C#]
  links:
    repo: https://github.com/DevBD1/graphSNA

- id: cognitive-fire
  title: CognitiveFire
  summary: A 3D shooter built in Unity as a team course project. Contributed to level design, model placement, gameplay scripting, and in-game AI.
  set: devbd1
  started: "2025-09"
  status: archived
  kind: Game
  stack: [Unity, C#]
  links:
    repo: https://github.com/DevBD1/CognitiveFire

- id: routiner
  title: Routiner
  summary: An AI proof of concept that turned spoken accounts of the day into structured journal entries to reduce logging friction in habit tracking.
  set: devbd1
  started: "2025-04"
  status: archived
  kind: iOS
  stack: [React Native]
  links:
    repo: https://github.com/DevBD1/routiner


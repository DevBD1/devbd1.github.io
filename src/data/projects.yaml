# Projects. The map places them by `set` and `started`; the résumé lists them in this order.
#
# Fields
#   id           unique
#   title
#   summary      one or two sentences
#   set          id from sets.yaml (the universal set = "Individual" column);
#                on the résumé, any other set is shown as the org it was built under
#   started      'YYYY' or 'YYYY-MM'; places it on the timeline.
#                Planned projects may leave it out: they show in the current year.
#   status       live | beta | building | planned | paused | archived
#                (the résumé shows no label for archived)
#   statusNote   optional, replaces the status label (e.g. TestFlight beta)
#   kind         short label: Web, iOS, Open source, Research …
#   stack        optional list
#   links        optional: site, store, repo — the title links to the first one present

- id: gyrolog
  title: Gyrolog
  summary: >-
    A journaling app that turns voice or text notes into a structured journal
    and collections, then connects your stated goals with what actually happened
    and surfaces patterns from your own records.
  set: kukso
  # Initial idea: 2026-06. Development began: 2026-07. TestFlight beta began: 2026-08.
  started: "2026-06"
  status: beta
  statusNote: TestFlight beta
  kind: iOS
  stack: [React Native]
  links:
    site: https://gyrolog.app


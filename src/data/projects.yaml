- id: firstspawn
  title: FirstSpawn
  summary: >-
    A Minecraft discovery platform designed to match players with suitable
    servers and help new servers reach the right audience. In early development;
    not yet in testing or publicly available.
  set: kukso
  # Initial idea date; development is ongoing and testing has not begun.
  started: "2026-01"
  status: building
  kind: Web
  stack: [Next.js, PostgreSQL, Redis]
  links:
    site: https://firstspawn.com

- id: gyrolog
  title: Gyrolog
  summary: >-
    Gyrolog is a personal operating system that helps you understand what pulls
    you away from your goals and find your way back. Capture thoughts,
    experiences, and ideas naturally by voice or text; Gyrolog helps organize
    them into a journal or collections. Over time, it connects your intentions
    with what actually happened, surfaces patterns grounded in your own records,
    and helps you reflect on what to adjust—so you can spend more time on what
    matters to you.
  set: kukso
  # Initial idea: 2026-06. Development began: 2026-07. TestFlight beta began: 2026-08.
  started: "2026-06"
  status: beta
  statusNote: TestFlight
  kind: iOS
  stack: [React Native]
  links:
    site: https://gyrolog.app


    reproducible, auditable research and testable strategies. Built for traders
    who understand financial markets and want to automate their strategies.
  set: wickdalgo
  started: "2026-01"
  status: building
  statusNote: Private development
  kind: Web
  links:
    site: https://wickd.kukso.com

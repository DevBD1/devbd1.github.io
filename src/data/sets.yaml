# The sets on the map.
#
# Exactly one set has `parent: null` — the universal set (U), i.e. you.
# Sets whose parent is the universal set each get their own column on the
# timeline, starting in the year they were `founded`. Deeper sets roll up into
# their top-level ancestor's column.
#
# Fields
#   id           unique, referenced by projects.yaml `set:`
#   symbol       one or two letters used in set notation (U, K, W …)
#   name, role, description
#   parent       id of the containing set, or null for the universal set
#   founded      'YYYY' or 'YYYY-MM' (required except for the universal set)
#   url          optional
#   tone         neutral | blue | orange | violet | green | teal | pink


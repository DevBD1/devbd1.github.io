name: Deploy React to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json','**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          if [ ! -f package.json ]; then
            echo "package.json missing — cannot install dependencies" >&2
            exit 1
          fi

          if [ -f package-lock.json ]; then
            echo "package-lock.json found — running npm ci"
            npm ci --no-audit --no-fund
          else
            echo "package-lock.json not found — running npm install to generate lockfile and install"
            npm install --no-audit --no-fund
          fi

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist/."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy
        uses: actions/deploy-pages@v4

  notify-profile:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Notify profile repo
        run: >
          curl -sS --fail -X POST
          -H "Authorization: Bearer ${{ secrets.PROFILE_DISPATCH_TOKEN }}"
          -H "Accept: application/vnd.github+json"
          https://api.github.com/repos/DevBD1/DevBD1/dispatches
          -d '{"event_type":"portfolio-updated"}'
